<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone - Final</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <!-- Navigation -->
  <nav id="navbar" class="navbar">
    <div class="navbar-left">
      <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo">
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">TV Shows</a>
        <a href="#">Movies</a>
        <a href="#">New & Popular</a>
        <a href="#">My List</a>
      </div>
    </div>
    <div class="navbar-right">
      <i class="fa-solid fa-search search-icon"></i>
      <i class="fa-solid fa-bell notification-icon"></i>
      <div class="profile-group">
        <img class="avatar" src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="User Avatar">
        <span class="user-name">Guest</span>
        <i class="fa-solid fa-caret-down"></i>
      </div>
    </div>
  </nav>

  <!-- Hero Banner -->
  <header class="banner">
    <div class="banner-content">
      <h1 class="banner-title">Money Heist</h1>
      <div class="banner-buttons">
        <button class="banner-button play-button"><i class="fa-solid fa-play"></i> Play</button>
        <button class="banner-button my-list-button"><i class="fa-solid fa-plus"></i> My List</button>
      </div>
      <p class="banner-description">
        To carry out the biggest heist in history, a mysterious man called The Professor recruits a band of eight robbers who have a single characteristic: none of them has anything to lose.
      </p>
    </div>
    <div class="banner-fadeBottom"></div>
  </header>

  <!-- Trending Now (Portrait - Real Movie Posters) -->
  <section class="row">
    <h2>Trending Now</h2>
    <div class="row-posters">
      <img class="row-poster row-posterLarge" src="https://m.media-amazon.com/images/M/MV5BMDZkYmVhNjMtNWU4MC00MDQxLWE3NjYtYWVlZGM1MWEzNDUyXkEyXkFqcGdeQXVyNTgwNzIyNzg@._V1_.jpg" alt="Stranger Things">
      <img class="row-poster row-posterLarge" src="https://m.media-amazon.com/images/M/MV5BODI0ZTljYTMtODQ1NC00NmI0LTk1YWUtN2FlNDM1MDExMDlhXkEyXkFqcGdeQXVyMTM0NTUzNDIy._V1_.jpg" alt="Money Heist">
      <img class="row-poster row-posterLarge" src="https://m.media-amazon.com/images/M/MV5BYWE3MDVkN2ItZDFhNi00ODVlLTg4ZmMtYmZhYmAwMGJkZDIzXkEyXkFqcGdeQXVyMzAwOTE0OQ@@._V1_.jpg" alt="Squid Game">
      <img class="row-poster row-posterLarge" src="https://m.media-amazon.com/images/M/MV5BYmQ4YWMxYjUtNjZmYi00MDQ1LWFjMTMtMWE1ZWFlOWFjNDg1XkEyXkFqcGdeQXVyMTMzNDExODE5._V1_.jpg" alt="Breaking Bad">
      <img class="row-poster row-posterLarge" src="https://m.media-amazon.com/images/M/MV5BZmY3ZDZhNDYtZTNmZC00YWZkLTk0MDQtMjU5MjI0YTM2NGExXkEyXkFqcGdeQXVyMDM2NDM2MQ@@._V1_.jpg" alt="Dark">
      <img class="row-poster row-posterLarge" src="https://m.media-amazon.com/images/M/MV5BZjNVNWQ1NjQtMzI5NC00ZWY1LThjOWQtZjk3NTgxMDgyOWZhXkEyXkFqcGdeQXVyMTMzNDExODE5._V1_.jpg" alt="Peaky Blinders">
    </div>
  </section>

  <!-- Netflix Originals (Landscape - Real Show Backdrops) -->
  <section class="row">
    <h2>Netflix Originals</h2>
    <div class="row-posters">
      <img class="row-poster" src="https://image.tmdb.org/t/p/w500/56v2KjBlU4XaOv9rVYEQypROD7P.jpg" alt="Stranger Things">
      <img class="row-poster" src="https://image.tmdb.org/t/p/w500/jBJWaqoSCiARWtfV0GlqZz5XWj1.jpg" alt="The Witcher">
      <img class="row-poster" src="https://image.tmdb.org/t/p/w500/iHSwvRVsRyxpX7FE7GbviaDvgGZ.jpg" alt="Wednesday">
      <img class="row-poster" src="https://image.tmdb.org/t/p/w500/b8thXEMgG3259Pz3K283526v55g.jpg" alt="Narcos">
      <img class="row-poster" src="https://image.tmdb.org/t/p/w500/vtdE2E723Dk8wK6hE8E4e4G5rG3.jpg" alt="Peaky Blinders">
      <img class="row-poster" src="https://image.tmdb.org/t/p/w500/34OGjFEbHj0E3lE2wOqTd81Exj.jpg" alt="Dark">
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
