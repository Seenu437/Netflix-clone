<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation -->
  <nav id="navbar">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo">
    <img class="avatar" src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="User Avatar">
  </nav>

  <!-- Featured Movie Banner -->
  <header class="banner">
    <div class="banner-content">
      <h1 class="banner-title">Money Heist</h1>
      <div class="banner-buttons">
        <button class="banner-button">Play</button>
        <button class="banner-button">My List</button>
      </div>
      <p class="banner-description">
        To carry out the biggest heist in history, a mysterious man called The Professor recruits a band of eight robbers who have a single characteristic: none of them has anything to lose.
      </p>
    </div>
    <div class="banner-fadeBottom"></div>
  </header>

  <!-- Content Rows -->
  <section class="row">
    <h2>Trending Now</h2>
    <div class="row-posters">
      <img class="row-poster row-posterLarge" src="https://image.tmdb.org/t/p/original/9PFonBhy4cQy7Jz20NpMygczOoO.jpg" alt="Movie 1">
      <img class="row-poster row-posterLarge" src="https://image.tmdb.org/t/p/original/bZvn77TzYQk8A5Ew6W4F3t97iO3.jpg" alt="Movie 2">
      <img class="row-poster row-posterLarge" src="https://image.tmdb.org/t/p/original/xGUINg5XGLg4q2r54qC9TtaOaP8.jpg" alt="Movie 3">
      <img class="row-poster row-posterLarge" src="https://image.tmdb.org/t/p/original/11BwA214nZ0bZ6k7qR9aX6v0r5D.jpg" alt="Movie 4">
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
