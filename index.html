<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone - Final</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <!-- Navigation -->
  <nav id="navbar" class="navbar">
    <div class="navbar-left">
      <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo">
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">TV Shows</a>
        <a href="#">Movies</a>
        <a href="#">New & Popular</a>
        <a href="#">My List</a>
      </div>
    </div>
    <div class="navbar-right">
      <i class="fa-solid fa-search search-icon"></i>
      <i class="fa-solid fa-bell notification-icon"></i>
      <div class="profile-group">
        <img class="avatar" src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="User Avatar">
        <span class="user-name">Guest</span>
        <i class="fa-solid fa-caret-down"></i>
      </div>
    </div>
  </nav>

  <!-- Hero Banner -->
  <header class="banner">
    <div class="banner-content">
      <h1 class="banner-title">Money Heist</h1>
      <div class="banner-buttons">
        <button class="banner-button play-button"><i class="fa-solid fa-play"></i> Play</button>
        <button class="banner-button my-list-button"><i class="fa-solid fa-plus"></i> My List</button>
      </div>
      <p class="banner-description">
        To carry out the biggest heist in history, a mysterious man called The Professor recruits a band of eight robbers who have a single characteristic: none of them has anything to lose.
      </p>
    </div>
    <div class="banner-fadeBottom"></div>
  </header>

  <!-- Trending Now (Portrait - Real Movie Posters) -->
    <!-- Trending Now (Portrait - Real Movie Posters) -->
  <section class="row">
    <h2>Trending Now</h2>
    <div class="row-posters">
      <img class="row-poster row-posterLarge" src="https://image.tmdb.org/t/p/w500/reEMJA1uzscCbkpeRJeTT2bjqUp.jpg" alt="Money Heist">
      <img class="row-poster row-posterLarge" src="https://image.tmdb.org/t/p/w500/49WJfeN0moxb9IPfGn8AIqMGskD.jpg" alt="Stranger Things">
      <img class="row-poster row-posterLarge" src="https://image.tmdb.org/t/p/w500/1XS1oqL89opfnbLl8WnZY1O1uJx.jpg" alt="Game of Thrones">
      <img class="row-poster row-posterLarge" src="https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg" alt="Breaking Bad">
      <img class="row-poster row-posterLarge" src="https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg" alt="The Dark Knight">
      <img class="row-poster row-posterLarge" src="https://image.tmdb.org/t/p/w500/arw2vcBveWOVZr6pxd9XTd1TdQa.jpg" alt="Forrest Gump">
    </div>
  </section>

  <!-- Netflix Originals (Landscape - Real Show Backdrops) -->
  <section class="row">
    <h2>Netflix Originals</h2>
    <div class="row-posters">
      <!-- The two that worked for you originally -->
      <img class="row-poster" src="https://image.tmdb.org/t/p/w500/56v2KjBlU4XaOv9rVYEQypROD7P.jpg" alt="Stranger Things">
      <img class="row-poster" src="https://image.tmdb.org/t/p/w500/iHSwvRVsRyxpX7FE7GbviaDvgGZ.jpg" alt="Wednesday">
      <!-- The updated ones using the identical w500 format -->
      <img class="row-poster" src="https://image.tmdb.org/t/p/w500/bsNm9z2TJfe0WO3RedPGWQ8mG1X.jpg" alt="Breaking Bad">
      <img class="row-poster" src="https://image.tmdb.org/t/p/w500/xKb6mtdfI5Qsggc44Hr9CCUDvaj.jpg" alt="Terminator 2">
      <img class="row-poster" src="https://image.tmdb.org/t/p/w500/qSc4L05AnHbMpSk0bsHuX25vX4V.jpg" alt="Spectre">
      <img class="row-poster" src="https://image.tmdb.org/t/p/w500/yzqaKAhglTrkeOfuIXYYArf0WnA.jpg" alt="The Dark Knight">
    </div>
  </section>
  
  <script src="script.js"></script>
</body>
</html>
