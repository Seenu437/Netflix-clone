<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone - Final</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <!-- Navigation -->
  <nav id="navbar" class="navbar">
    <div class="navbar-left">
      <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo">
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">TV Shows</a>
        <a href="#">Movies</a>
        <a href="#">New & Popular</a>
        <a href="#">My List</a>
      </div>
    </div>
    <div class="navbar-right">
      <i class="fa-solid fa-search search-icon"></i>
      <i class="fa-solid fa-bell notification-icon"></i>
      <div class="profile-group">
        <img class="avatar" src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="User Avatar">
        <span class="user-name">Guest</span>
        <i class="fa-solid fa-caret-down"></i>
      </div>
    </div>
  </nav>

  <!-- Hero Banner -->
  <header class="banner">
    <div class="banner-content">
      <h1 class="banner-title">Money Heist</h1>
      <div class="banner-buttons">
        <button class="banner-button play-button"><i class="fa-solid fa-play"></i> Play</button>
        <button class="banner-button my-list-button"><i class="fa-solid fa-plus"></i> My List</button>
      </div>
      <p class="banner-description">
        To carry out the biggest heist in history, a mysterious man called The Professor recruits a band of eight robbers who have a single characteristic: none of them has anything to lose.
      </p>
    </div>
    <div class="banner-fadeBottom"></div>
  </header>

  <!-- Trending Now (Portrait) -->
  <section class="row">
    <h2>Trending Now</h2>
    <div class="row-posters">
      <img class="row-poster row-posterLarge" src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?w=300&h=450&fit=crop" alt="Trending 1">
      <img class="row-poster row-posterLarge" src="https://images.unsplash.com/photo-1533613220915-609f661a6fe1?w=300&h=450&fit=crop" alt="Trending 2">
      <img class="row-poster row-posterLarge" src="https://images.unsplash.com/photo-1596727147705-611529d38dc6?w=300&h=450&fit=crop" alt="Trending 3">
      <img class="row-poster row-posterLarge" src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=300&h=450&fit=crop" alt="Trending 4">
      <img class="row-poster row-posterLarge" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=300&h=450&fit=crop" alt="Trending 5">
      <img class="row-poster row-posterLarge" src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=300&h=450&fit=crop" alt="Trending 6">
    </div>
  </section>

  <!-- Netflix Originals (Landscape) -->
  <section class="row">
    <h2>Netflix Originals</h2>
    <div class="row-posters">
      <img class="row-poster" src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=400&h=225&fit=crop" alt="Original 1">
      <img class="row-poster" src="https://images.unsplash.com/photo-1518676590629-3dcbd9c5a5c9?w=400&h=225&fit=crop" alt="Original 2">
      <img class="row-poster" src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=400&h=225&fit=crop" alt="Original 3">
      <img class="row-poster" src="https://images.unsplash.com/photo-1505686994434-e3cc5abf1330?w=400&h=225&fit=crop" alt="Original 4">
      <img class="row-poster" src="https://images.unsplash.com/photo-1515634928627-2a4e0dae3ddf?w=400&h=225&fit=crop" alt="Original 5">
      <img class="row-poster" src="https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=400&h=225&fit=crop" alt="Original 6">
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
